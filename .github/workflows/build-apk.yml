
name: WORLD AT WAR PORT 1.0.2 - APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: world-at-war-port-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          set +o pipefail
          yes | sdkmanager --licenses
          RESULT=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$RESULT" -ne 0 ]; then
            echo "Android SDK license acceptance failed."
            exit 1
          fi

      - name: Find and extract version 1.0.2 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/WORLD-AT-WAR-PORT-1.0.2-STARTUP-GUARD.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: The required ZIP file is missing."
            echo "Upload WORLD-AT-WAR-PORT-1.0.2-STARTUP-GUARD.zip to the repository root."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/worldatwar/port/MainActivity.kt

          echo "All required project files were found."

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      - name: Check APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/WORLD-AT-WAR-PORT-1.0.2.apk"

          echo "APK successfully generated."
          ls -lh "$GITHUB_WORKSPACE/output/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WORLD-AT-WAR-PORT-1.0.2-APK
          path: output/WORLD-AT-WAR-PORT-1.0.2.apk
          if-no-files-found: error
          retention-days: 14
