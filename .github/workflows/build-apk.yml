
name: WORLD AT WAR PORT 0.5.0 - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: world-at-war-port-build
  cancel-in-progress: true

jobs:
  build:
    name: Extract and Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE="$(find . -maxdepth 2 -type f \
            -iname 'WORLD-AT-WAR-PORT-0.5.0.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f \
              -iname '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS="$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found in ZIP"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure existing Android SDK
        shell: bash
        run: |
          set -e

          SDK=/usr/local/lib/android/sdk

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f -name sdkmanager -print | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Verify Android project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          test -f app/src/main/AndroidManifest.xml

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "Gradle settings missing"
            exit 1
          fi

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "App Gradle file missing"
            exit 1
          fi

          echo "Project verification successful"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WORLD-AT-WAR-PORT-0.5.0-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
