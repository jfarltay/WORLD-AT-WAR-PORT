
name: WORLD AT WAR PORT - APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: world-at-war-port-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android ARM64 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android Project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            PROJECT_DIR="."
          else
            mkdir -p extracted

            mapfile -t ZIP_FILES < <(
              find . -maxdepth 3 -type f -iname "*.zip" \
                ! -path "./.git/*" | sort
            )

            if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
              echo "ERROR: No project ZIP found."
              exit 1
            fi

            if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
              echo "ERROR: Multiple ZIP files found."
              printf '%s\n' "${ZIP_FILES[@]}"
              exit 1
            fi

            ZIP_FILE="${ZIP_FILES[0]}"

            echo "Checking ZIP: $ZIP_FILE"
            unzip -t "$ZIP_FILE"

            unzip -q "$ZIP_FILE" -d extracted

            SETTINGS_FILE="$(
              find extracted -type f \
                \( -name "settings.gradle.kts" \
                -o -name "settings.gradle" \) \
                -print -quit
            )"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: Gradle settings file not found."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: App Gradle file missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ready: $PROJECT_DIR"

      - name: Setup Android Command Line Tools
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android SDK..."

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/ndk/27.0.12077973"
          test -d "$ANDROID_HOME/cmake/3.22.1"

          echo "Android SDK is ready."

      - name: Build ARM64 Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WORLD-AT-WAR-PORT-ARM64-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
