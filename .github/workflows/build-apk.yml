
name: WORLD AT WAR PORT 0.8.0 CINEMATIC

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: world-at-war-port-build
  cancel-in-progress: true

jobs:
  build:
    name: Extract and Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -iname 'WORLD-AT-WAR-PORT-0.8.0-CINEMATIC.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname '*.zip' \
              -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          echo "Archive: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_HOME"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f -name sdkmanager -print | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using: $SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses
          LICENSE_STATUS=$?
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "License command returned: $LICENSE_STATUS"
          fi

          "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/cpp/CMakeLists.txt

          echo "Project files verified."

          grep -n "compileSdk" app/build.gradle.kts
          grep -n "version" app/build.gradle.kts

      - name: Verify Java and Android tools
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version
          "$ANDROID_HOME/platform-tools/adb" version

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/ndk/27.0.12077973"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WORLD-AT-WAR-PORT-0.8.0-CINEMATIC-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
